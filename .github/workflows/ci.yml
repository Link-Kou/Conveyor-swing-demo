name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JBR 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
          java-package: jdk
          cache: maven

      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify
