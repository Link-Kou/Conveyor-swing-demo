name: CI

on:
  push:
    branches:
      - main
      - jbr17-windows-x86
      - jpackage-jbr17-win32-win64-macos
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress clean verify
