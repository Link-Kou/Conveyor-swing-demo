name: JBR 17 Native Packages

on:
  push:
    branches:
      - jpackage-jbr17-win32-win64-macos
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jpackage-release-${{ github.ref }}
  cancel-in-progress: true

env:
  JBR_VERSION: 17.0.14
  JBR_BUILD: b1367.22

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: macos-aarch64
            label: macOS Apple Silicon
            runner: macos-15
            platform: mac
            jbr_arch: osx-aarch64
            jbr_ext: tar.gz
          - id: macos-x64
            label: macOS Intel
            runner: macos-15-intel
            platform: mac
            jbr_arch: osx-x64
            jbr_ext: tar.gz
          - id: windows-x64
            label: Windows 64-bit
            runner: windows-2022
            platform: windows
            jbr_arch: windows-x64
            jbr_ext: zip
          - id: windows-x86
            label: Windows 32-bit (Windows 7 compatible JBR)
            runner: windows-2022
            platform: windows
            jbr_arch: windows-x86
            jbr_ext: tar.gz
            jbr_version: 17.0.11
            jbr_build: b1312.2

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17 for Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Read application version
        shell: bash
        run: |
          VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME} must match pom.xml version $VERSION" >&2
            exit 1
          fi
          echo "Building version $VERSION for ${{ matrix.id }}"

      - name: Download and extract target JBRSDK (macOS)
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="jbrsdk-${JBR_VERSION}-${{ matrix.jbr_arch }}-${JBR_BUILD}.tar.gz"
          URL="https://cache-redirector.jetbrains.com/intellij-jbr/$ARCHIVE"
          mkdir -p "$RUNNER_TEMP/jbr-sdk"
          curl --fail --location --retry 3 "$URL" -o "$RUNNER_TEMP/jbr-sdk.tar.gz"
          tar -xzf "$RUNNER_TEMP/jbr-sdk.tar.gz" -C "$RUNNER_TEMP/jbr-sdk"
          JLINK="$(find "$RUNNER_TEMP/jbr-sdk" -type f -path '*/bin/jlink' | head -n 1)"
          test -n "$JLINK"
          JBR_HOME="$(dirname "$(dirname "$JLINK")")"
          echo "JBR_HOME=$JBR_HOME" >> "$GITHUB_ENV"
          "$JBR_HOME/bin/java" -version
          "$JBR_HOME/bin/jpackage" --version

      - name: Download, verify and select target JBRSDK (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = "${{ matrix.jbr_version || env.JBR_VERSION }}"
          $build = "${{ matrix.jbr_build || env.JBR_BUILD }}"
          $archive = "jbrsdk-$version-${{ matrix.jbr_arch }}-$build.${{ matrix.jbr_ext }}"
          $baseUrl = "https://cache-redirector.jetbrains.com/intellij-jbr"
          $extract = Join-Path $env:RUNNER_TEMP "jbr-sdk"
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          $download = Join-Path $env:RUNNER_TEMP $archive

          Invoke-WebRequest -Uri "$baseUrl/$archive" -OutFile $download
          Invoke-WebRequest -Uri "$baseUrl/$archive.checksum" -OutFile "$download.checksum"

          # Verify the exact SDK archive before extracting it.
          $checksumText = Get-Content "$download.checksum" -Raw
          $checksumMatch = [regex]::Match($checksumText, '(?i)\b[0-9a-f]{128}\b')
          if (-not $checksumMatch.Success) {
            throw "Could not parse SHA-512 checksum for $archive"
          }
          $actualHash = (Get-FileHash -Path $download -Algorithm SHA512).Hash
          if ($actualHash -ne $checksumMatch.Value.ToUpperInvariant()) {
            throw "SHA-512 mismatch for $archive. Expected $($checksumMatch.Value), got $actualHash"
          }
          Write-Host "Verified SHA-512: $actualHash"

          if ($archive.EndsWith(".zip")) {
            Expand-Archive -Path $download -DestinationPath $extract -Force
          } else {
            tar.exe -xzf $download -C $extract
            if ($LASTEXITCODE -ne 0) { throw "tar failed to extract $archive" }
          }

          # Do not trust the archive name or filesystem enumeration order.
          # Select the JBRSDK whose own java.exe reports the requested bitness.
          $expectedBits = if ("${{ matrix.id }}" -eq "windows-x86") { "32" } else { "64" }
          $expectedArch = if ($expectedBits -eq "32") { "x86" } else { "amd64" }
          $matchedHomes = @()
          $jlinks = Get-ChildItem -Path $extract -Filter jlink.exe -Recurse -File
          foreach ($candidate in $jlinks) {
            $candidateHome = Split-Path (Split-Path $candidate.FullName -Parent) -Parent
            $javaExe = Join-Path $candidateHome "bin\java.exe"
            if (-not (Test-Path $javaExe)) { continue }
            $info = (& $javaExe -XshowSettings:properties -version 2>&1 | Out-String)
            Write-Host "Candidate JBR: $candidateHome"
            Write-Host $info
            $archOk = $info -match "(?m)^\s*os\.arch\s*=\s*$expectedArch\s*$"
            $bitsOk = $info -match "(?m)^\s*sun\.arch\.data\.model\s*=\s*$expectedBits\s*$"
            if ($archOk -and $bitsOk) {
              $matchedHomes += $candidateHome
            }
          }
          if ($matchedHomes.Count -ne 1) {
            throw "Expected exactly one $expectedBits-bit JBRSDK ($expectedArch), found $($matchedHomes.Count). Candidates: $($matchedHomes -join '; ')"
          }

          $jbrHome = $matchedHomes[0]
          foreach ($tool in @("java.exe", "jdeps.exe", "jlink.exe", "jpackage.exe")) {
            if (-not (Test-Path (Join-Path $jbrHome "bin\$tool"))) {
              throw "Required JBRSDK tool missing: $tool in $jbrHome"
            }
          }
          if (-not (Test-Path (Join-Path $jbrHome "jmods"))) {
            throw "JBRSDK jmods directory missing: $jbrHome"
          }
          Write-Host "Selected JBR_HOME=$jbrHome"
          "JBR_HOME=$jbrHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install WiX Toolset 3 for jpackage (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $wixBin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) {
            choco install wixtoolset --yes --no-progress
          }
          if (-not (Test-Path $wixBin)) { throw "WiX Toolset 3 was not found at $wixBin" }
          $wixBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) { throw "candle.exe not found" }
          if (-not (Test-Path (Join-Path $wixBin "light.exe"))) { throw "light.exe not found" }

      - name: Build application JAR and runtime dependencies
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Build trimmed runtime and macOS DMG
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/package-macos.sh
          scripts/package-macos.sh "$JBR_HOME" "$APP_VERSION" "${{ matrix.id }}"

      - name: Build trimmed runtime and Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          ./scripts/package-windows.ps1 -JbrHome "$env:JBR_HOME" -AppVersion "$env:APP_VERSION" -Architecture "${{ matrix.id }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.id }}
          path: target/dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
