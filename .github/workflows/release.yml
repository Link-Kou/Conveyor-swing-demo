name: Release Desktop Client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: desktop-client-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JBR 21
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
          java-package: jdk
          cache: maven

      - name: Check tag matches Maven version
        shell: bash
        run: |
          VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" != "$TAG" ]]; then
            echo "Git tag ($TAG) must match pom.xml version ($VERSION)." >&2
            exit 1
          fi

      - name: Verify Maven project
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Package and publish macOS + Windows installers
        uses: hydraulic-software/conveyor/actions/build@v22.3
        env:
          OAUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          command: make copied-site
          signing_key: ${{ secrets.SIGNING_KEY }}
          agree_to_license: '1'
          conveyor_version: '22.3'
