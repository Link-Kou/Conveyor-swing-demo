  <path d="M72 345 278 345 440 421 234 421Z" fill="url(#belt)"/>
  <path d="M72 345 278 345 278 367 72 367Z" fill="#64748B"/>
  <path d="M234 421 440 421 440 443 234 443Z" fill="#111827"/>
  <g fill="#CBD5E1">
