<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#E58A2B"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>

  <!-- Rounded blue app tile -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)"/>
  <path d="M58 148C111 64 207 35 299 42" fill="none" stroke="#FFFFFF" stroke-opacity=".13" stroke-width="22" stroke-linecap="round"/>

