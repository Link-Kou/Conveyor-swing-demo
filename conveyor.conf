# Conveyor 22.3.1: bundle JetBrains Runtime 21 for each target OS/architecture.
include required("/stdlib/jdk/21/jetbrains.conf")

# Keep the package version synchronized with pom.xml.
include "#!=app.version mvn -q help:evaluate -Dexpression=project.version -DforceStdout"

app {
    display-name = "Desktop Client Starter"
    fsname = "desktop-client-starter"
    vendor = "Example Vendor"
    rdns-name = "com.example.desktopclient"
    description = "A Java Swing desktop application packaged with JetBrains Runtime"

    # Open-source licensing metadata for Conveyor.
    license = "MIT"
    vcs-url = "https://github.com/Link-Kou/Conveyor-swing-demo"

    # Build only the requested platforms: Intel Mac, Apple Silicon Mac and Windows x64.
    machines = [ mac.aarch64, mac.amd64, windows.amd64 ]

    # Maven creates the application JAR and copies runtime dependencies here.
    inputs += "target/desktop-client.jar"
    inputs += "target/classpath-jars"

    updates = background

    site {
        # Keep this URL unchanged after the first public release.
        base-url = "https://github.com/Link-Kou/Conveyor-swing-demo/releases/latest/download"
        copy-to = "github:Link-Kou/Conveyor-swing-demo"
        github.oauth-token = ${?env.OAUTH_TOKEN}
    }

    jvm {
        gui.main-class = com.example.desktopclient.Main
        # Preserve Conveyor's automatic jdeps detection and add Swing/TLS modules.
        modules += java.desktop
        modules += java.logging
        modules += jdk.crypto.ec
        options += "-Xms128m"
        options += "-Xmx2048m"
    }

    icons = "icons/app-256.png"
}
